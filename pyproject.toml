[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitecheck"
version = "0.1.0"
description = "Market Opportunity Tracker monitoring service"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "tglogging @ git+https://github.com/licryle/tglogging.git@v0.0.5",
]

[project.scripts]
sitecheck = "sitecheck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
